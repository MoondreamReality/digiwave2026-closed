<style>
:root { --purple: #6f00ff; --mint: #00e8c8; --sky: #92eeff; --peach: #f9d2ba; --pink: #f39399; --ink: #e0e0e0; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; }
body {
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100svh; overflow-x: hidden;
}
main {
  position: relative; z-index: 1; width: 100%; max-width: 720px;
  padding: max(28px, env(safe-area-inset-top)) 20px max(36px, env(safe-area-inset-bottom));
  text-align: center;
}
.kv { display: block; width: 100%; height: auto; margin: 0 auto 22px; border-radius: 22px; box-shadow: 0 0 0 1px #ffffff14, 0 18px 60px #6f00ff40; }
.words { position: relative; z-index: 1; display: grid; gap: 18px; }
.zh { margin: 0; font-size: clamp(26px, 7.4vw, 44px); font-weight: 800; letter-spacing: .06em; line-height: 1.35; }
.zh span { display: inline-block; }
.en { margin: 0; font-size: clamp(17px, 4.6vw, 26px); font-weight: 600; line-height: 1.4; color: var(--mint); }
.bar { width: 56px; height: 6px; border-radius: 3px; margin: 4px auto 0; background: linear-gradient(90deg, var(--purple) 0 40%, var(--pink) 40% 60%, var(--peach) 60% 80%, var(--sky) 80%); }
.info { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--ink); letter-spacing: .04em; }
.info b { font-weight: 600; color: #fff; }
.float { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.m { position: absolute; width: var(--s); height: auto; opacity: .95; animation: bob 4.2s ease-in-out infinite; pointer-events: none; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
@media (min-width: 900px) { .m { width: calc(var(--s) * 1.5); } .info { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { .m { animation: none; } }
@media (max-width: 480px) { .m:nth-child(3), .m:nth-child(4) { display: none; } }
</style>
</head>
